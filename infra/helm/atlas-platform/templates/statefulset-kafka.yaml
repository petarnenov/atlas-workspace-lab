{{ include "atlas-platform.guard" . }}
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "kafka",
    "namespace": {{ .Release.Namespace | toJson }},
    "labels": {
      "app.kubernetes.io/managed-by": "Helm",
      "app.kubernetes.io/part-of": "atlas-workspace-lab",
      "atlas-lab/environment": {{ .Values.environment | toJson }}
    },
    "annotations": {
      "meta.helm.sh/release-name": {{ .Release.Name | toJson }},
      "meta.helm.sh/release-namespace": {{ .Release.Namespace | toJson }}
    }
  },
  "spec": {
    "serviceName": "kafka",
    "replicas": {{ ternary 0 (int (index .Values.replicas "kafka")) .Values.stopped }},
    "selector": {
      "matchLabels": {
        "app": "kafka"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "kafka",
          "atlas-lab/environment": {{ .Values.environment | toJson }}
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "fsGroup": 1000,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "initContainers": [
          {
            "name": "config-seed",
            "image": {{ index .Values.images "kafka" | toJson }},
            "imagePullPolicy": "Never",
            "command": [
              "/bin/sh",
              "-ec",
              "cp -R /opt/kafka/config/. /config/"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/config"
              }
            ]
          }
        ],
        "containers": [
          {
            "name": "kafka",
            "image": {{ index .Values.images "kafka" | toJson }},
            "imagePullPolicy": "Never",
            "ports": [
              {
                "containerPort": 19092
              }
            ],
            "env": [
              {
                "name": "KAFKA_NODE_ID",
                "value": "1"
              },
              {
                "name": "KAFKA_PROCESS_ROLES",
                "value": "broker,controller"
              },
              {
                "name": "KAFKA_LISTENERS",
                "value": "INTERNAL://:19092,CONTROLLER://:9093"
              },
              {
                "name": "KAFKA_ADVERTISED_LISTENERS",
                "value": "INTERNAL://kafka-client:19092"
              },
              {
                "name": "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP",
                "value": "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
              },
              {
                "name": "KAFKA_INTER_BROKER_LISTENER_NAME",
                "value": "INTERNAL"
              },
              {
                "name": "KAFKA_CONTROLLER_LISTENER_NAMES",
                "value": "CONTROLLER"
              },
              {
                "name": "KAFKA_CONTROLLER_QUORUM_VOTERS",
                "value": "1@kafka:9093"
              },
              {
                "name": "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR",
                "value": "1"
              },
              {
                "name": "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR",
                "value": "1"
              },
              {
                "name": "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR",
                "value": "1"
              },
              {
                "name": "KAFKA_LOG_RETENTION_HOURS",
                "value": "168"
              },
              {
                "name": "KAFKA_LOG_DIRS",
                "value": "/var/lib/kafka/data"
              },
              {
                "name": "KAFKA_AUTO_CREATE_TOPICS_ENABLE",
                "value": "false"
              },
              {
                "name": "KAFKA_HEAP_OPTS",
                "value": "-Xms256m -Xmx512m"
              }
            ],
            "envFrom": [],
            "resources": {{ index .Values.resources "kafka" | toJson }},
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "data",
                "mountPath": "/var/lib/kafka/data"
              },
              {
                "name": "config",
                "mountPath": "/opt/kafka/config"
              },
              {
                "name": "logs",
                "mountPath": "/opt/kafka/logs"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "/opt/kafka/bin/kafka-topics.sh",
                  "--bootstrap-server",
                  "localhost:19092",
                  "--list"
                ]
              },
              "periodSeconds": 15,
              "timeoutSeconds": 10
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "/opt/kafka/bin/kafka-topics.sh",
                  "--bootstrap-server",
                  "localhost:19092",
                  "--list"
                ]
              },
              "periodSeconds": 15,
              "timeoutSeconds": 10,
              "failureThreshold": 90
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "/opt/kafka/bin/kafka-topics.sh",
                  "--bootstrap-server",
                  "localhost:19092",
                  "--list"
                ]
              },
              "periodSeconds": 15,
              "timeoutSeconds": 10,
              "failureThreshold": 12
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          },
          {
            "name": "config",
            "emptyDir": {}
          },
          {
            "name": "logs",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": {{ .Values.storageSize | toJson }}
            }
          }
        }
      }
    ],
    "persistentVolumeClaimRetentionPolicy": {
      "whenDeleted": "Retain",
      "whenScaled": "Retain"
    }
  }
}
