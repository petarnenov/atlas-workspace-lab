{{ include "atlas-platform.guard" . }}
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "dns",
    "namespace": {{ .Release.Namespace | toJson }},
    "labels": {
      "app.kubernetes.io/managed-by": "Helm",
      "app.kubernetes.io/part-of": "atlas-workspace-lab",
      "atlas-lab/environment": {{ .Values.environment | toJson }}
    },
    "annotations": {
      "meta.helm.sh/release-name": {{ .Release.Name | toJson }},
      "meta.helm.sh/release-namespace": {{ .Release.Namespace | toJson }}
    }
  },
  "spec": {
    "podSelector": {},
    "policyTypes": [
      "Egress"
    ],
    "egress": [
      {
        "to": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "kube-system"
              }
            },
            "podSelector": {
              "matchLabels": {
                "k8s-app": "kube-dns"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "UDP",
            "port": 53
          },
          {
            "protocol": "TCP",
            "port": 53
          }
        ]
      }
    ]
  }
}
