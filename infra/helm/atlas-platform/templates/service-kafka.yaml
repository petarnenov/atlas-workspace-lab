{{ include "atlas-platform.guard" . }}
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "kafka",
    "namespace": {{ .Release.Namespace | toJson }},
    "labels": {
      "app.kubernetes.io/managed-by": "Helm",
      "app.kubernetes.io/part-of": "atlas-workspace-lab",
      "atlas-lab/environment": {{ .Values.environment | toJson }}
    },
    "annotations": {
      "meta.helm.sh/release-name": {{ .Release.Name | toJson }},
      "meta.helm.sh/release-namespace": {{ .Release.Namespace | toJson }}
    }
  },
  "spec": {
    "selector": {
      "app": "kafka"
    },
    "clusterIP": "None",
    "publishNotReadyAddresses": true,
    "ports": [
      {
        "name": "main",
        "port": 19092,
        "targetPort": 19092
      },
      {
        "name": "controller",
        "port": 9093,
        "targetPort": 9093
      }
    ]
  }
}
