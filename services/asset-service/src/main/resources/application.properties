server.port=8081
server.address=127.0.0.1
spring.datasource.url=${ASSET_DB_URL:jdbc:postgresql://localhost:5432/assets}
spring.datasource.username=asset_owner
spring.datasource.password=${LAB_ASSET_DB_PASSWORD}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=asset-outcomes-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.listener.ack-mode=record
lab.identity.public-key=${LAB_SERVICE_PUBLIC_KEY:.local/service-public.pem}
lab.objects.endpoint=${LAB_OBJECT_ENDPOINT:http://localhost:9000}
lab.objects.password=${LAB_ASSET_OBJECT_PASSWORD}
lab.artifacts.enabled=${LAB_ARTIFACT_ENABLED:false}
lab.objects.artifact-password=${LAB_ARTIFACT_OBJECT_PASSWORD:}
lab.identity.worker-public-key=${LAB_WORKER_PUBLIC_KEY:.local/worker-public.pem}
