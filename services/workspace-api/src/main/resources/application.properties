server.port=8080
server.address=127.0.0.1
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
lab.identity.public-key=${LAB_FIXTURE_PUBLIC_KEY:.local/fixture-public.pem}
lab.identity.private-key=${LAB_SERVICE_PRIVATE_KEY:.local/service-private.pem}
lab.asset.url=${LAB_ASSET_URL:http://localhost:8081}
lab.artifacts.enabled=${LAB_ARTIFACT_ENABLED:false}
