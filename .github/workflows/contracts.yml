name: LAB-101 contract validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse source contracts and assert critical invariants
        run: node scripts/check-contracts.mjs
      - name: Validate OpenAPI 3.1 schema
        run: npx --yes @redocly/cli@2.72.1 lint contracts/openapi/*.v1.json --extends=spec
      - name: Validate AsyncAPI 3 schema
        run: npx --yes @asyncapi/cli@6.2.2 validate contracts/asyncapi/asset-events.v1.json --fail-severity error
