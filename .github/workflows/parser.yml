name: Docling parser
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  promotion-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require same-repository dev to main promotion
        env:
          PROMOTION_HEAD: ${{ github.event.pull_request.head.ref }}
          PROMOTION_BASE: ${{ github.event.pull_request.base.ref }}
          PROMOTION_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          node --input-type=module <<'JS'
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request' ||
              process.env.PROMOTION_HEAD !== 'dev' ||
              process.env.PROMOTION_BASE !== 'main' ||
              process.env.PROMOTION_REPOSITORY !== process.env.GITHUB_REPOSITORY)
            throw Error('Only same-repository dev to main promotion is allowed');
          JS
  parser:
    needs: promotion-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make parser-test
      - run: node --test --experimental-test-coverage --test-coverage-include='scripts/local/parsed-copy.mjs' --test-coverage-include='scripts/local/parser-credentials.mjs' --test-coverage-include='scripts/local/parser-forward.mjs' --test-coverage-lines=75 --test-coverage-branches=75 scripts/local/parsed-copy.test.mjs scripts/local/parser-forward.test.mjs
